<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controllo del contratto di igiene urbana – Torre de' Passeri</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  --ink:#17324D; --ink-2:#2E4A66; --paper:#F5F6F3; --panel:#FFFFFF; --line:#D9DED8; --text:#22303C; --muted:#5E6B78;
  --ok:#2F855A; --ko:#C53030; --part:#C05621; --nv:#98A2AE; --due:#2B6CB0; --warn-bg:#FFF6E5;
  --radius:4px; --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
a{color:var(--due)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.top{background:var(--ink);color:#fff;padding:14px 22px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.top h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.2px}
.top .sub{color:#B9C6D3;font-size:13px;margin-top:2px}
.params{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.params label{display:flex;flex-direction:column;font-size:12px;color:#B9C6D3;gap:3px}
.params input{padding:5px 8px;border:1px solid #3F5B77;border-radius:var(--radius);background:#22415E;color:#fff;width:150px}
.params input:focus{outline:2px solid #9DC3E6;outline-offset:1px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 11px;border-radius:var(--radius)}
.btn:hover{background:#EEF1EC}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-2)}
.btn.danger{color:var(--ko);border-color:#E9B4B4}
.top .btn{border-color:#3F5B77;background:#22415E;color:#fff}
.top .btn:hover{background:#2E5379}
.layout{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 66px)}
nav{background:#fff;border-right:1px solid var(--line);padding:14px 0}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:10px 18px;color:var(--muted);font-size:14px}
nav button.active{border-left-color:var(--ink);color:var(--ink);font-weight:600;background:#F0F3EE}
nav button:hover{background:#F0F3EE}
nav .count{float:right;color:var(--nv);font-size:12px}
main{padding:22px 26px;max-width:1500px}
h2{font-size:18px;font-weight:600;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 18px;max-width:80ch}
.notice{background:var(--warn-bg);border:1px solid #F1D9A6;padding:10px 14px;border-radius:var(--radius);margin-bottom:18px;max-width:90ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.card .n{font-size:28px;font-weight:600;line-height:1.1}
.card .l{color:var(--muted);font-size:13px}
.card.ok .n{color:var(--ok)} .card.ko .n{color:var(--ko)} .card.part .n{color:var(--part)} .card.due .n{color:var(--due)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px}
.panel h3{margin:0 0 10px;font-size:15px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{flex:1;min-width:240px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius)}
.toolbar select{padding:7px 8px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12px;position:sticky;top:0;background:#fff;z-index:1}
tr.row{cursor:pointer}
tr.row:hover td{background:#F5F8F3}
tr.row.sel td{background:#EAF1E5}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--ok)}.dot.ko{background:var(--ko)}.dot.part{background:var(--part)}.dot.nv{background:var(--nv)}.dot.due{background:var(--due)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:3px;color:var(--muted);margin-right:4px;white-space:nowrap}
.id{font-weight:600;color:var(--ink);white-space:nowrap}
.split{display:grid;grid-template-columns:1fr 430px;gap:18px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.tablewrap{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:var(--radius)}
.detail{position:sticky;top:12px}
.detail dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:6px 10px}
.detail dt{color:var(--muted);font-size:12px;padding-top:2px}
.detail dd{margin:0}
.detail .empty{color:var(--muted);padding:30px 10px;text-align:center}
form.v{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
form.v label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
form.v input,form.v select,form.v textarea{padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius)}
form.v textarea{grid-column:1/-1;min-height:60px}
form.v .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.hist{margin:10px 0 0;padding:0;list-style:none;font-size:13px}
.hist li{padding:6px 0;border-top:1px dashed var(--line)}
.hist small{color:var(--muted)}
.gauge{width:100%;height:26px;background:#EDF0EA;border-radius:13px;overflow:hidden;position:relative}
.gauge .bar{height:100%;background:var(--part)}
.gauge .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.deadline{display:flex;gap:10px;padding:7px 0;border-top:1px dashed var(--line);align-items:baseline}
.deadline .d{width:92px;font-weight:600;white-space:nowrap}
.deadline .d.over{color:var(--ko)}
.deadline .d.soon{color:var(--part)}
.deadline .t{flex:1}
.deadline .t a{color:var(--text);text-decoration:none}
.deadline .t a:hover{text-decoration:underline}
svg text{font-family:var(--font)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.help{font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--radius);opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.sr{position:absolute;left:-9999px}
@media (max-width:800px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;padding:0}nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}nav button.active{border-bottom-color:var(--ink)}main{padding:14px}}
@media print{.top .params,.top .btn,nav,.toolbar,form.v{display:none}.layout{grid-template-columns:1fr}.tablewrap{max-height:none;overflow:visible}}

/* guida al primo avvio */
.tour-back{position:fixed;inset:0;z-index:50;pointer-events:none}
.tour-spot{position:fixed;z-index:51;border-radius:6px;box-shadow:0 0 0 9999px rgba(23,50,77,.55);pointer-events:none;transition:all .25s}
.tour-box{position:fixed;z-index:52;background:#fff;border-radius:6px;padding:16px 18px;width:360px;max-width:calc(100vw - 24px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tour-box h4{margin:0 0 6px;font-size:15px}
.tour-box p{margin:0 0 12px;color:var(--text)}
.tour-box .steps{font-size:12px;color:var(--muted);margin-right:auto}
.tour-box .actions{display:flex;gap:8px;align-items:center}
.tour-box.center{top:50%;left:50%;transform:translate(-50%,-50%);width:520px}
.tour-box .choice{display:grid;gap:8px;margin:12px 0}
.tour-box .choice button{text-align:left;padding:10px 12px}
.tour-box .choice small{display:block;color:var(--muted);font-weight:normal}
.demo-banner{background:#E8F1FA;border-bottom:1px solid #BFD6EA;color:#1E4E79;padding:8px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.demo-banner button{margin-left:auto}
@media (prefers-reduced-motion:reduce){.tour-spot{transition:none}}
</style>
</head>

<header class="top">
  <div>
    <h1>Controllo del contratto di igiene urbana</h1>
    <div class="sub">Comune di Torre de' Passeri · gestore Diodoro Ecologia S.r.l. · supporto al programma di controlli del DEC (Schema di contratto, art. 17)</div>
  </div>

    <button class="btn" id="btnImport">Carica stato</button>

</header>
<div class="demo-banner" id="demoBanner" hidden>Stai usando <b>dati di esempio</b> (date, canone, verifiche e una contestazione inventati) per provare il portale. <button class="btn" id="btnTour2">Rivedi la guida</button> <button class="btn danger" id="btnDemoOff">Azzera i dati di esempio</button></div>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
// ===================== dati e stato =====================
const DATA = JSON.parse(document.getElementById('data').textContent);
const OBB = DATA.obblighi, PEN = Object.fromEntries(DATA.penali.map(p=>[p.codice,p])), AREE = DATA.aree;
// nomi dei PDF nella cartella "docs/" accanto a questa pagina (rinominare i file di conseguenza)
const DOCS = {
  CSA:{file:'docs/1_Capitolato_Speciale_dAppalto_CSA.pdf', nome:"Capitolato Speciale d'Appalto"},
  DT:{file:'docs/2_Disciplinare_Tecnico_DT.pdf', nome:'Disciplinare Tecnico'},
  Schema:{file:'docs/3_Schema_di_contratto.pdf', nome:'Schema di contratto', offset:1},
  Progetto:{file:'docs/0_Progetto_dei_servizi_di_igiene_urbana.pdf', nome:'Progetto dei servizi di igiene urbana'},
  'Allegato F':{file:'docs/2_3_Allegato_F_Piano_Spazzamento_Strade.pdf', nome:'Allegato F – Piano spazzamento'},
  'Allegato D':{file:'docs/2_2_Allegato_D_Elenco_prezzi_unitari.pdf', nome:'Allegato D – Elenco prezzi'},
  'Allegato B':{file:'docs/2_1_Allegato_B_Elenco_personale_cessante.pdf', nome:'Allegato B – Personale cessante'},
  'Allegato H':{file:'docs/2_5_Allegato_H_PEF_MTR_ARERA.pdf', nome:'Allegato H – PEF MTR'},
};
const ESITI = {ok:'Conforme', ko:'Non conforme', part:'Parziale', nv:'Non verificato'};
const KEY = 'dec-torre-stato-v1';
let state = {avvio:'', canone:'', dec:'Simona Mantenuto', verifiche:{}, contestazioni:[]};
try{ const s = localStorage.getItem(KEY); if(s) state = Object.assign(state, JSON.parse(s)); }catch(e){}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1800); }

// ===================== utilità =====================
const fmt = d => d ? new Date(d).toLocaleDateString('it-IT') : '—';
const eur = n => n==null||n===''||isNaN(n) ? '—' : Number(n).toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const today = () => { const t=new Date(); t.setHours(0,0,0,0); return t; };
const norm = s => (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function addMonths(d,n){ const r=new Date(d); const day=r.getDate(); r.setMonth(r.getMonth()+n); if(r.getDate()!==day) r.setDate(0); return r; }
function scadenza(o){ // prima scadenza calcolata dalla data di avvio
  if(!state.avvio || !o.regola) return null;
  const a = new Date(state.avvio+'T00:00:00'); const r=o.regola;
  if(r.type==='months') return addMonths(a,r.n);
  if(r.type==='days'){ const d=new Date(a); d.setDate(d.getDate()+r.n); return d; }
  let d=new Date(a.getFullYear()+r.yplus, r.m-1, r.d); if(d<=a) d=new Date(a.getFullYear()+r.yplus+1, r.m-1, r.d); return d;
}
function prossimaScadenza(o){ // per le annuali: prossima ricorrenza rispetto a oggi
  const s=scadenza(o); if(!s) return null; if(!o.regola||o.regola.type!=='annual') return s;
  const t=today(); let d=new Date(s); while(d<t){ d=new Date(d.getFullYear()+1,d.getMonth(),d.getDate()); } return d;
}
function ultimaVerifica(o){ const v=state.verifiche[o.id]||[]; return v.length? v[v.length-1] : null; }
function stato(o){ const v=ultimaVerifica(o); return v? v.esito : 'nv'; }
function fonteLinks(f){ // "CSA art. 17, pp. 23-26; DT art. 20 p. 24" -> link al PDF alla pagina
  return f.split(';').map(part=>{
    const p=part.trim(); let key=null;
    for(const k of Object.keys(DOCS).sort((a,b)=>b.length-a.length)) if(p.startsWith(k)){key=k;break;}
    const m=p.match(/p{1,2}\.\s*(\d+)/); if(!key||!m) return p;
    const page=parseInt(m[1])+(DOCS[key].offset||0);
    return `<a href="${DOCS[key].file}#page=${page}" target="_blank" title="${DOCS[key].nome}, pagina ${page}">${p}</a>`;
  }).join('; ');
}
function penLinks(cs){ return (cs||[]).map(c=>PEN[c]?`<span class="tag" title="${PEN[c].descrizione} — ${eur(PEN[c].min)}–${eur(PEN[c].max)} ${PEN[c].unita}">${c}</span>`:c).join(''); }

// ===================== navigazione =====================
const VIEWS = [['cruscotto','Cruscotto'],['registro','Registro obblighi'],['timeline','Scadenze e timeline'],['contestazioni','Contestazioni e penali'],['penali','Tabella penali'],['documenti','Documenti e istruzioni']];
let view = 'cruscotto', selId = null, filtro = {q:'', area:'', tipo:'', stato:''};
function nav(){ document.getElementById('nav').innerHTML = VIEWS.map(([k,l])=>`<button class="${view===k?'active':''}" data-v="${k}">${l}${k==='registro'?`<span class="count">${OBB.length}</span>`:''}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v; render();}); }
var render=function(){ nav(); const m=document.getElementById('main'); m.innerHTML=''; ({cruscotto,registro,timeline,contestazioni,penali,documenti})[view](m); };

// ===================== cruscotto =====================
function cruscotto(m){
  const t=today(); const counts={ok:0,ko:0,part:0,nv:0}; OBB.forEach(o=>counts[stato(o)]++);
  const scad = OBB.map(o=>({o,d:prossimaScadenza(o)})).filter(x=>x.d).sort((a,b)=>a.d-b.d);
  const over = scad.filter(x=>x.d<t && !(ultimaVerifica(x.o) && new Date(ultimaVerifica(x.o).data)>=x.d));
  const soon = scad.filter(x=>x.d>=t && (x.d-t)/864e5<=60);
  const anno=t.getFullYear(); const cum=state.contestazioni.filter(c=>c.esito==='applicata'&&new Date(c.rilevazione).getFullYear()===anno).reduce((s,c)=>s+Number(c.importoApplicato||0),0);
  const soglia = state.canone? state.canone*0.1 : null;
  m.innerHTML = `<h2>Cruscotto</h2><p class="lead">Stato di verifica dei ${OBB.length} obblighi contrattuali, scadenze in arrivo e penali cumulate nell'anno solare ${anno}.</p>
  ${!state.avvio?'<div class="notice">Inserisci la data del verbale di consegna in alto: senza quella data le scadenze una tantum (sistema informativo, app, TQRIF, ecosportello…) non possono essere calcolate.</div>':''}
  <div class="cards">
    <div class="card ok"><div class="n">${counts.ok}</div><div class="l">conformi all'ultima verifica</div></div>
    <div class="card ko"><div class="n">${counts.ko}</div><div class="l">non conformi</div></div>
    <div class="card part"><div class="n">${counts.part}</div><div class="l">parzialmente conformi</div></div>
    <div class="card"><div class="n">${counts.nv}</div><div class="l">mai verificati</div></div>
    <div class="card ${over.length?'ko':'due'}"><div class="n">${over.length}</div><div class="l">scadenze superate senza verifica</div></div>
    <div class="card due"><div class="n">${soon.length}</div><div class="l">scadenze nei prossimi 60 giorni</div></div>
  </div>
  <div class="two">
    <div class="panel"><h3>Stato delle verifiche per area</h3><div id="areeChart"></div>
      <div class="legend"><span><i class="dot ok"></i>conforme</span><span><i class="dot part"></i>parziale</span><span><i class="dot ko"></i>non conforme</span><span><i class="dot nv"></i>non verificato</span></div></div>
    <div>
      <div class="panel"><h3>Penali applicate nel ${anno} rispetto alla soglia di risoluzione</h3>
        <div class="gauge"><div class="bar" style="width:${soglia?Math.min(100,cum/soglia*100):0}%;background:${soglia&&cum/soglia>=1?'var(--ko)':cum>0?'var(--part)':'var(--ok)'}"></div><div class="lbl">${eur(cum)} ${soglia?`su ${eur(soglia)} (${(cum/soglia*100).toFixed(1)}%)`:'— inserisci il canone per la soglia del 10%'}</div></div>
        <p class="help">Oltre il 10% del canone annuo, calcolato sull'anno solare, l'Ente ha facoltà di risolvere il contratto (CSA art. 17, p. 27; art. 19, p. 28).</p></div>
      <div class="panel"><h3>Prossime scadenze e scadenze superate</h3>
        ${[...over,...soon].slice(0,14).map(x=>`<div class="deadline"><span class="d ${x.d<t?'over':'soon'}">${fmt(x.d)}</span><span class="t"><a href="#" data-go="${x.o.id}"><span class="id">${x.o.id}</span> · ${x.o.obbligo.slice(0,110)}${x.o.obbligo.length>110?'…':''}</a></span></div>`).join('') || '<p class="help">Nessuna scadenza calcolabile: inserisci la data di avvio.</p>'}
      </div>
    </div>
  </div>`;
  m.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault(); view='registro'; selId=a.dataset.go; filtro={q:'',area:'',tipo:'',stato:''}; render();});
  // grafico D3: barre impilate per area
  const rows = AREE.map(a=>{const r={area:a,ok:0,part:0,ko:0,nv:0}; OBB.filter(o=>o.area===a).forEach(o=>r[stato(o)]++); return r;});
  const W = Math.min(700, m.querySelector('#areeChart').clientWidth||600), H = rows.length*26+10, ml=250;
  const svg=d3.select('#areeChart').append('svg').attr('width',W).attr('height',H);
  const x=d3.scaleLinear().domain([0,d3.max(rows,r=>r.ok+r.part+r.ko+r.nv)]).range([ml,W-10]);
  const y=d3.scaleBand().domain(rows.map(r=>r.area)).range([5,H-5]).padding(.25);
  const col={ok:'#2F855A',part:'#C05621',ko:'#C53030',nv:'#98A2AE'};
  const series=d3.stack().keys(['ok','part','ko','nv'])(rows);
  svg.selectAll('g.s').data(series).join('g').attr('fill',d=>col[d.key]).selectAll('rect').data(d=>d).join('rect')
    .attr('x',d=>x(d[0])).attr('y',d=>y(d.data.area)).attr('width',d=>x(d[1])-x(d[0])).attr('height',y.bandwidth())
    .append('title').text(d=>`${d.data.area}: ${d[1]-d[0]}`);
  svg.selectAll('text.l').data(rows).join('text').attr('class','l').attr('x',ml-8).attr('y',d=>y(d.area)+y.bandwidth()/2+4).attr('text-anchor','end').attr('font-size',12).attr('fill','#22303C').text(d=>d.area.length>34?d.area.slice(0,33)+'…':d.area);
  svg.selectAll('text.n').data(rows).join('text').attr('class','n').attr('x',d=>x(d.ok+d.part+d.ko+d.nv)+5).attr('y',d=>y(d.area)+y.bandwidth()/2+4).attr('font-size',11).attr('fill','#5E6B78').text(d=>d.ok+d.part+d.ko+d.nv);
  svg.selectAll('rect').style('cursor','pointer').on('click',(e,d)=>{ if(d&&d.data){view='registro'; filtro={q:'',area:d.data.area,tipo:'',stato:''}; render();} });
}

// ===================== registro =====================
function registro(m){
  const tipi=[...new Set(OBB.map(o=>o.tipo))];
  m.innerHTML=`<h2>Registro degli obblighi</h2><p class="lead">Cerca un dubbio con parole semplici (es. "festivi", "cestini", "numero verde", "15 giorni") oppure filtra per area. Seleziona una riga per leggere fonte, penale e per registrare una verifica.</p>
  <div class="toolbar"><input type="search" id="q" placeholder="Cerca in obblighi, verifiche, fonti, note…" value="${filtro.q}">
   <select id="fArea"><option value="">Tutte le aree</option>${AREE.map(a=>`<option ${filtro.area===a?'selected':''}>${a}</option>`).join('')}</select>
   <select id="fTipo"><option value="">Tutti i tipi</option>${tipi.map(a=>`<option ${filtro.tipo===a?'selected':''}>${a}</option>`).join('')}</select>
   <select id="fStato"><option value="">Qualsiasi esito</option>${Object.entries(ESITI).map(([k,v])=>`<option value="${k}" ${filtro.stato===k?'selected':''}>${v}</option>`).join('')}</select>
   <button class="btn" id="btnCsv">Esporta CSV</button></div>
  <div class="split"><div class="tablewrap"><table><thead><tr><th>Stato</th><th>ID</th><th>Obbligo</th><th>Frequenza / termine</th><th>Scadenza</th><th>Penale</th></tr></thead><tbody id="tb"></tbody></table></div><div class="detail panel" id="detail"></div></div>`;
  const list=()=>{ const q=norm(filtro.q).split(/\s+/).filter(Boolean);
    return OBB.filter(o=>(!filtro.area||o.area===filtro.area)&&(!filtro.tipo||o.tipo===filtro.tipo)&&(!filtro.stato||stato(o)===filtro.stato)&&q.every(t=>norm([o.id,o.area,o.obbligo,o.frequenza,o.verifica,o.conseguenza,o.fonte,o.note].join(' ')).includes(t))); };
  const draw=()=>{ const L=list(); document.getElementById('tb').innerHTML=L.map(o=>`<tr class="row ${selId===o.id?'sel':''}" data-id="${o.id}"><td><i class="dot ${stato(o)}" title="${ESITI[stato(o)]}"></i></td><td class="id">${o.id}</td><td>${o.obbligo}<div class="help">${o.area}</div></td><td>${o.frequenza}</td><td>${fmt(prossimaScadenza(o))}</td><td>${penLinks(o.penali)}</td></tr>`).join('')||'<tr><td colspan="6" class="help">Nessun obbligo corrisponde alla ricerca.</td></tr>';
    document.querySelectorAll('tr.row').forEach(r=>r.onclick=()=>{selId=r.dataset.id; draw(); detail();}); if(!L.find(o=>o.id===selId)) selId=null; detail(); };
  const detail=()=>{ const el=document.getElementById('detail'); const o=OBB.find(x=>x.id===selId); if(!o){el.innerHTML='<div class="empty">Seleziona un obbligo per vedere i dettagli e registrare una verifica.</div>';return;}
    const hist=(state.verifiche[o.id]||[]).slice().reverse();
    el.innerHTML=`<h3><span class="id">${o.id}</span> · ${o.area}</h3><p>${o.obbligo}</p>
    <dl><dt>Tipo</dt><dd>${o.tipo}</dd><dt>Frequenza</dt><dd>${o.frequenza}</dd><dt>Scadenza</dt><dd>${fmt(prossimaScadenza(o))}${o.regola&&!state.avvio?' <span class="help">(serve la data di avvio)</span>':''}</dd>
    <dt>Come si verifica</dt><dd>${o.verifica}</dd><dt>Conseguenza</dt><dd>${o.conseguenza} ${penLinks(o.penali)}</dd><dt>Fonte</dt><dd>${fonteLinks(o.fonte)}</dd>${o.note?`<dt>Note</dt><dd>${o.note}</dd>`:''}</dl>
    <form class="v" id="fv"><label>Data verifica<input type="date" name="data" value="${new Date().toISOString().slice(0,10)}" required></label>
    <label>Esito<select name="esito">${Object.entries(ESITI).filter(([k])=>k!=='nv').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
    <textarea name="nota" placeholder="Cosa è stato controllato, evidenza raccolta (foto, GPS, protocollo), chi ha verificato"></textarea>
    <div class="actions">${stato(o)==='ko'||stato(o)==='part'?`<button type="button" class="btn" id="btnCont">Apri contestazione</button>`:''}<button class="btn primary">Registra verifica</button></div></form>
    <ul class="hist">${hist.map((v,i)=>`<li><i class="dot ${v.esito}"></i><b>${ESITI[v.esito]}</b> · ${fmt(v.data)} <button class="btn" style="float:right;padding:1px 6px;font-size:11px" data-del="${hist.length-1-i}">elimina</button><br><small>${v.nota||''}</small></li>`).join('')}</ul>`;
    el.querySelector('#fv').onsubmit=e=>{e.preventDefault(); const f=new FormData(e.target); (state.verifiche[o.id]=state.verifiche[o.id]||[]).push({data:f.get('data'),esito:f.get('esito'),nota:f.get('nota'),dec:state.dec}); state.verifiche[o.id].sort((a,b)=>a.data.localeCompare(b.data)); persist(); toast('Verifica registrata'); draw();};
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ state.verifiche[o.id].splice(+b.dataset.del,1); persist(); draw(); });
    const bc=el.querySelector('#btnCont'); if(bc) bc.onclick=()=>{ view='contestazioni'; window._prefill={id:o.id,pen:o.penali[0]||'P44',desc:o.obbligo.slice(0,90)}; render(); };
  };
  ['q','fArea','fTipo','fStato'].forEach(id=>{ const el=document.getElementById(id); el.oninput=el.onchange=()=>{ filtro={q:document.getElementById('q').value,area:document.getElementById('fArea').value,tipo:document.getElementById('fTipo').value,stato:document.getElementById('fStato').value}; draw(); }; });
  document.getElementById('btnCsv').onclick=()=>{ const L=list(); const esc=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
    const csv=['ID;Area;Obbligo;Tipo;Frequenza;Scadenza;Verifica;Conseguenza;Fonte;Note;Ultimo esito;Ultima verifica'].concat(L.map(o=>{const v=ultimaVerifica(o);return [o.id,o.area,o.obbligo,o.tipo,o.frequenza,fmt(prossimaScadenza(o)),o.verifica,o.conseguenza,o.fonte,o.note,ESITI[stato(o)],v?fmt(v.data):''].map(esc).join(';');})).join('\n');
    download('registro_obblighi.csv','\ufeff'+csv,'text/csv'); };
  draw();
}

// ===================== timeline =====================
function timeline(m){
  m.innerHTML=`<h2>Scadenze e timeline</h2><p class="lead">L'anno contrattuale con le scadenze una tantum (calcolate dal verbale di consegna), le ricorrenze a data fissa e le verifiche registrate. Le zone senza verifiche sono quelle che l'ANAC contesta nelle sue delibere: controlli solo a posteriori e senza evidenze.</p>
  ${!state.avvio?'<div class="notice">Inserisci la data del verbale di consegna per calcolare le scadenze.</div>':''}
  <div class="panel"><div class="toolbar"><label>Dal <input type="date" id="tFrom"></label><label>Al <input type="date" id="tTo"></label></div><div id="tl"></div>
  <div class="legend"><span><i class="dot due"></i>scadenza contrattuale</span><span><i class="dot ko"></i>scadenza superata senza verifica</span><span><i class="dot ok"></i>verifica conforme</span><span><i class="dot part"></i>parziale</span><span><i class="dot ko"></i>non conforme</span></div></div>
  <div class="panel"><h3>Elenco scadenze nel periodo</h3><div id="tlList"></div></div>`;
  const t=today(); const from=document.getElementById('tFrom'), to=document.getElementById('tTo');
  const a0 = state.avvio? new Date(state.avvio+'T00:00:00') : new Date(t.getFullYear(),0,1);
  from.value=new Date(Math.min(a0, new Date(t.getFullYear(),t.getMonth()-3,1))).toISOString().slice(0,10); to.value=new Date(t.getFullYear()+1,t.getMonth(),1).toISOString().slice(0,10);
  const draw=()=>{ const f=new Date(from.value), e=new Date(to.value); const el=document.getElementById('tl'); el.innerHTML='';
    const ev=[]; OBB.forEach(o=>{ const s=scadenza(o); if(s){ let d=new Date(s); const rep=o.regola.type==='annual'; do{ if(d>=f&&d<=e){ const v=(state.verifiche[o.id]||[]).find(x=>new Date(x.data)>=d); ev.push({d:new Date(d),o,kind:'scad',over:d<t&&!v}); } if(!rep) break; d=new Date(d.getFullYear()+1,d.getMonth(),d.getDate()); }while(d<=e); }
      (state.verifiche[o.id]||[]).forEach(v=>{ const d=new Date(v.data+'T00:00:00'); if(d>=f&&d<=e) ev.push({d,o,kind:v.esito}); }); });
    const W=Math.min(1300, el.clientWidth||900), H=AREE.length*30+70, ml=250;
    const svg=d3.select(el).append('svg').attr('width',W).attr('height',H);
    const x=d3.scaleTime().domain([f,e]).range([ml,W-20]); const y=d3.scaleBand().domain(AREE).range([40,H-25]);
    svg.append('g').attr('transform',`translate(0,${H-25})`).call(d3.axisBottom(x).ticks(d3.timeMonth.every(1)).tickFormat(d3.timeFormat('%b %y'))).selectAll('text').attr('font-size',11);
    svg.selectAll('line.g').data(AREE).join('line').attr('x1',ml).attr('x2',W-20).attr('y1',d=>y(d)+y.bandwidth()/2).attr('y2',d=>y(d)+y.bandwidth()/2).attr('stroke','#E6EAE3');
    svg.selectAll('text.a').data(AREE).join('text').attr('x',ml-8).attr('y',d=>y(d)+y.bandwidth()/2+4).attr('text-anchor','end').attr('font-size',12).text(d=>d.length>34?d.slice(0,33)+'…':d);
    if(t>=f&&t<=e) svg.append('line').attr('x1',x(t)).attr('x2',x(t)).attr('y1',30).attr('y2',H-25).attr('stroke','#17324D').attr('stroke-dasharray','4 3'), svg.append('text').attr('x',x(t)+4).attr('y',26).attr('font-size',11).attr('fill','#17324D').text('oggi');
    const col={scad:'#2B6CB0',ok:'#2F855A',part:'#C05621',ko:'#C53030'};
    svg.selectAll('circle').data(ev).join('circle').attr('cx',d=>x(d.d)).attr('cy',d=>y(d.o.area)+y.bandwidth()/2+(d.kind==='scad'?-5:5)).attr('r',d=>d.kind==='scad'?5:4)
      .attr('fill',d=>d.kind==='scad'?(d.over?'#C53030':col.scad):col[d.kind]).attr('fill-opacity',d=>d.kind==='scad'?1:.85).style('cursor','pointer')
      .on('click',(e,d)=>{view='registro';selId=d.o.id;filtro={q:'',area:'',tipo:'',stato:''};render();})
      .append('title').text(d=>`${fmt(d.d)} · ${d.o.id} · ${d.kind==='scad'?'scadenza':ESITI[d.kind]}\n${d.o.obbligo.slice(0,140)}`);
    document.getElementById('tlList').innerHTML = ev.filter(v=>v.kind==='scad').sort((a,b)=>a.d-b.d).map(v=>`<div class="deadline"><span class="d ${v.over?'over':''}">${fmt(v.d)}</span><span class="t"><span class="id">${v.o.id}</span> · ${v.o.obbligo.slice(0,120)}${v.o.obbligo.length>120?'…':''} <span class="help">(${v.o.frequenza})</span></span></div>`).join('')||'<p class="help">Nessuna scadenza nel periodo.</p>';
  };
  from.onchange=to.onchange=draw; draw();
}

// ===================== contestazioni =====================
function contestazioni(m){
  const pf=window._prefill||{}; window._prefill=null;
  const anno=today().getFullYear(); const soglia=state.canone?state.canone*0.1:null;
  const anni=[...new Set(state.contestazioni.map(c=>new Date(c.rilevazione).getFullYear()).concat([anno]))].sort();
  m.innerHTML=`<h2>Contestazioni e penali</h2><p class="lead">Procedura dell'art. 17 CSA: contestazione via PEC o raccomandata, controdeduzioni entro 5 giorni, decisione del RUP entro 10 giorni dalle controdeduzioni (o 5 dalla scadenza del termine), trattenuta sul primo canone utile. Dalla prima recidiva le penali raddoppiano; oltre il 10% del canone annuo scatta la facoltà di risoluzione.</p>
  <div class="two"><div class="panel"><h3>Nuova contestazione</h3><form class="v" id="fc">
    <label>ID obbligo<input name="id" list="ids" value="${pf.id||''}" required><datalist id="ids">${OBB.map(o=>`<option value="${o.id}">${o.obbligo.slice(0,60)}</option>`).join('')}</datalist></label>
    <label>Codice penale<select name="pen">${DATA.penali.map(p=>`<option value="${p.codice}" ${pf.pen===p.codice?'selected':''}>${p.codice} · ${p.descrizione.slice(0,60)}</option>`).join('')}</select></label>
    <label>Data rilevazione<input type="date" name="rilevazione" value="${new Date().toISOString().slice(0,10)}" required></label>
    <label>Data notifica contestazione<input type="date" name="notifica"></label>
    <label>Importo base (€)<input type="number" name="importo" min="0" step="10" required></label>
    <label>Recidiva<select name="recidiva"><option>No</option><option>Sì</option></select></label>
    <textarea name="desc" placeholder="Descrizione sintetica del fatto">${pf.desc||''}</textarea>
    <div class="actions"><button class="btn primary">Registra contestazione</button></div></form>
    <p class="help">L'importo base va scelto entro il minimo e il massimo della penale (vedi Tabella penali); moltiplicatori per giorno/unità vanno già calcolati nell'importo.</p></div>
    <div class="panel"><h3>Cumulato per anno solare</h3>${anni.map(a=>{const cum=state.contestazioni.filter(c=>c.esito==='applicata'&&new Date(c.rilevazione).getFullYear()===a).reduce((s,c)=>s+Number(c.importoApplicato||0),0);return `<div style="margin-bottom:10px"><b>${a}</b><div class="gauge"><div class="bar" style="width:${soglia?Math.min(100,cum/soglia*100):0}%;background:${soglia&&cum/soglia>=1?'var(--ko)':'var(--part)'}"></div><div class="lbl">${eur(cum)}${soglia?` · ${(cum/soglia*100).toFixed(1)}% della soglia ${eur(soglia)}`:''}</div></div></div>`;}).join('')}
    <p class="help">Solo le contestazioni con esito "applicata" concorrono al cumulato (CSA art. 17, p. 27).</p></div></div>
  <div class="tablewrap"><table><thead><tr><th>N.</th><th>Obbligo</th><th>Penale</th><th>Fatto</th><th>Rilevazione</th><th>Notifica</th><th>Termine controdeduzioni</th><th>Controdeduzioni ricevute</th><th>Termine decisione RUP</th><th>Importo applicato</th><th>Esito</th><th></th></tr></thead><tbody id="tc"></tbody></table></div>`;
  const addD=(d,n)=>{ if(!d) return null; const r=new Date(d+'T00:00:00'); r.setDate(r.getDate()+n); return r; };
  const draw=()=>{ document.getElementById('tc').innerHTML=state.contestazioni.map((c,i)=>{ const tc=addD(c.notifica,5); const tr=c.controdeduzioni? addD(c.controdeduzioni,10) : (tc? new Date(tc.getTime()+5*864e5):null);
    return `<tr><td>${c.n}</td><td class="id">${c.id}</td><td><span class="tag" title="${PEN[c.pen]?PEN[c.pen].descrizione:''}">${c.pen}</span></td><td>${c.desc||''}</td><td>${fmt(c.rilevazione)}</td><td><input type="date" value="${c.notifica||''}" data-f="notifica" data-i="${i}"></td><td>${fmt(tc)}</td><td><input type="date" value="${c.controdeduzioni||''}" data-f="controdeduzioni" data-i="${i}"></td><td>${fmt(tr)}</td><td>${eur(c.importoApplicato)}${c.recidiva==='Sì'?' <span class="tag">recidiva ×2</span>':''}</td><td><select data-f="esito" data-i="${i}">${['in corso','applicata','archiviata'].map(e=>`<option ${c.esito===e?'selected':''}>${e}</option>`).join('')}</select></td><td><button class="btn danger" data-del="${i}">elimina</button></td></tr>`; }).join('')||'<tr><td colspan="12" class="help">Nessuna contestazione registrata.</td></tr>';
    document.querySelectorAll('#tc [data-f]').forEach(el=>el.onchange=()=>{ state.contestazioni[+el.dataset.i][el.dataset.f]=el.value; persist(); render(); });
    document.querySelectorAll('#tc [data-del]').forEach(b=>b.onclick=()=>{ if(confirm('Eliminare la contestazione?')){ state.contestazioni.splice(+b.dataset.del,1); persist(); render(); } }); };
  document.getElementById('fc').onsubmit=e=>{ e.preventDefault(); const f=new FormData(e.target); const y=new Date(f.get('rilevazione')).getFullYear(); const n=`C-${y}-${String(state.contestazioni.filter(c=>c.n.startsWith('C-'+y)).length+1).padStart(2,'0')}`;
    const imp=Number(f.get('importo')); state.contestazioni.push({n,id:f.get('id'),pen:f.get('pen'),desc:f.get('desc'),rilevazione:f.get('rilevazione'),notifica:f.get('notifica')||'',controdeduzioni:'',importo:imp,recidiva:f.get('recidiva'),importoApplicato:f.get('recidiva')==='Sì'?imp*2:imp,esito:'in corso'}); persist(); toast('Contestazione '+n+' registrata'); render(); };
  draw();
}

// ===================== penali =====================
function penali(m){
  m.innerHTML=`<h2>Tabella penali (CSA art. 17, pp. 23-26)</h2><p class="lead">Importi minimi e massimi per ogni inadempienza. Cliccando una riga si aprono gli obblighi collegati nel registro.</p>
  <div class="toolbar"><input type="search" id="pq" placeholder="Cerca nella tabella…"></div><div class="tablewrap"><table><thead><tr><th>Codice</th><th>Inadempienza</th><th>Min</th><th>Max</th><th>Unità</th><th>Obblighi collegati</th></tr></thead><tbody id="tp"></tbody></table></div>`;
  const draw=()=>{ const q=norm(document.getElementById('pq').value); document.getElementById('tp').innerHTML=DATA.penali.filter(p=>!q||norm(p.codice+' '+p.descrizione+' '+p.unita).includes(q)).map(p=>`<tr class="row" data-p="${p.codice}"><td class="id">${p.codice}</td><td>${p.descrizione}</td><td>${eur(p.min)}</td><td>${eur(p.max)}</td><td>${p.unita}</td><td>${OBB.filter(o=>o.penali.includes(p.codice)).length}</td></tr>`).join('');
    document.querySelectorAll('#tp tr.row').forEach(r=>r.onclick=()=>{ view='registro'; filtro={q:r.dataset.p,area:'',tipo:'',stato:''}; render(); }); };
  document.getElementById('pq').oninput=draw; draw();
}

// ===================== documenti =====================
function documenti(m){
  m.innerHTML=`<h2>Documenti e istruzioni</h2><p class="lead">La pagina funziona senza server: si apre dal file, su intranet o da chiavetta. Lo stato (verifiche e contestazioni) resta nel browser di chi la usa; per condividerlo tra più persone si usa "Salva stato" e "Carica stato".</p>
  <div class="two"><div class="panel"><h3>Cartella dei documenti</h3><p>I riferimenti nella colonna "Fonte" aprono il PDF alla pagina indicata se i file si trovano nella cartella <code>docs/</code> accanto a questa pagina, con questi nomi:</p>
  <table>${Object.entries(DOCS).map(([k,d])=>`<tr><td class="id">${k}</td><td>${d.nome}</td><td><code>${d.file}</code></td></tr>`).join('')}</table>
  <p class="help">Per lo Schema di contratto la numerazione stampata è sfalsata di una pagina rispetto al PDF: il collegamento ne tiene conto. Le pagine si aprono con <code>#page=N</code>, supportato da Chrome, Edge e Firefox.</p></div>
  <div class="panel"><h3>Come si usa</h3><ol>
   <li>Inserire in alto la data del verbale di consegna e il canone annuo netto: alimentano scadenze e soglia del 10%.</li>
   <li>Nel Registro, cercare l'obbligo, controllare l'evidenza indicata in "Come si verifica" e registrare l'esito. Ogni verifica registrata è una riga del verbale annuale dei controlli (CSA art. 6).</li>
   <li>Se l'esito è "Non conforme", aprire la contestazione dal pannello: il sistema numera la pratica e calcola i termini.</li>
   <li>A fine anno, "Esporta CSV" dal registro e il JSON dello stato costituiscono la documentazione delle verifiche svolte, quella che ANAC (delibere 82/2025 e 497/2024) chiede di poter esibire.</li>
   <li>Il file JSON salvato va conservato nella cartella condivisa dell'ufficio: è l'unica copia dello stato.</li></ol>
  <p class="help">Registro estratto dai documenti di gara (CSA, DT, Schema di contratto, Progetto, allegati) in bozza da validare con il DEC. Non sono inclusi: offerta tecnica, contratto firmato, verbale di consegna, atto di nomina del DEC.</p>
  <p><button class="btn" id="btnTourDocs">Rivedi la guida introduttiva</button> <button class="btn danger" id="btnReset">Azzera tutte le verifiche e contestazioni</button></p></div></div>`;
  document.getElementById('btnReset').onclick=()=>{ if(confirm('Cancellare tutte le verifiche e contestazioni registrate in questo browser? Salva prima lo stato se vuoi conservarlo.')){ state.verifiche={}; state.contestazioni=[]; persist(); render(); } };
}

// ===================== import/export e parametri =====================
function download(name,content,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),500); }
document.getElementById('btnExport').onclick=()=>download(`stato_controlli_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(state,null,1), 'application/json');
document.getElementById('btnImport').onclick=()=>document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const s=JSON.parse(t); if(!s.verifiche) throw 0; state=Object.assign({verifiche:{},contestazioni:[]},s); persist(); initParams(); render(); toast('Stato caricato'); }catch(err){ alert('Il file non è uno stato valido di questa pagina.'); } }); e.target.value=''; };
function initParams(){ document.getElementById('pAvvio').value=state.avvio||''; document.getElementById('pCanone').value=state.canone||''; document.getElementById('pDec').value=state.dec||''; }
document.getElementById('pAvvio').onchange=e=>{ state.avvio=e.target.value; persist(); render(); };
document.getElementById('pCanone').onchange=e=>{ state.canone=Number(e.target.value)||''; persist(); render(); };
document.getElementById('pDec').onchange=e=>{ state.dec=e.target.value; persist(); };
initParams();

// ===================== dati di esempio e guida al primo avvio =====================
const TOUR_KEY='dec-torre-tour-v1';
function demoState(){
  const t=today(); const iso=d=>d.toISOString().slice(0,10); const ago=n=>{const d=new Date(t);d.setDate(d.getDate()-n);return iso(d);};
  const avvio=new Date(t.getFullYear(),t.getMonth()-5,1); // cinque mesi fa: le scadenze a 3 mesi sono già passate
  return {avvio:iso(avvio),canone:260000,dec:'Simona Mantenuto',demo:true,
    verifiche:{
      'AVV-03':[{data:ago(70),esito:'ok',nota:'ESEMPIO – credenziali del portale ricevute via PEC; accesso provato dal DEC.'}],
      'AVV-04':[{data:ago(60),esito:'part',nota:'ESEMPIO – app scaricabile ma mancano notifiche push e calendario per zona.'}],
      'RAC-03':[{data:ago(20),esito:'ok',nota:'ESEMPIO – passaggi organico verificati su GPS per via Roma e Corso Mazzini.'},{data:ago(3),esito:'ko',nota:'ESEMPIO – turno del lunedì saltato in via Tufara; foto e tracciato GPS allegati.'}],
      'COM-08':[{data:ago(12),esito:'ko',nota:'ESEMPIO – chiamata di prova al numero verde: attesa 6 minuti, oltre i 240 secondi.'}],
      'SPA-01':[{data:ago(8),esito:'part',nota:'ESEMPIO – spazzamento manuale eseguito ma cordoli non decespugliati in via del Fossato.'}],
      'STR-05':[{data:ago(5),esito:'ok',nota:'ESEMPIO – area mercato pulita entro le 15:00, foto orarie.'}],
      'PER-04':[{data:ago(5),esito:'ok',nota:'ESEMPIO – operatori in divisa con targhetta.'}],
    },
    contestazioni:[{n:'C-'+t.getFullYear()+'-01',id:'COM-08',pen:'P23',desc:'ESEMPIO – numero verde: tempo di attesa 6 minuti nella chiamata di prova',rilevazione:ago(12),notifica:ago(10),controdeduzioni:ago(6),importo:250,recidiva:'No',importoApplicato:250,esito:'applicata'},
                   {n:'C-'+t.getFullYear()+'-02',id:'RAC-03',pen:'P05',desc:'ESEMPIO – mancata raccolta organico via Tufara',rilevazione:ago(3),notifica:ago(2),controdeduzioni:'',importo:500,recidiva:'No',importoApplicato:500,esito:'in corso'}]};
}
function demoOff(){ state={avvio:'',canone:'',dec:'Simona Mantenuto',verifiche:{},contestazioni:[]}; persist(); initParams(); render(); toast('Dati di esempio rimossi'); }
function updateBanner(){ const b=document.getElementById('demoBanner'); b.hidden=!state.demo; }
document.getElementById('btnDemoOff').onclick=()=>{ if(confirm('Rimuovere i dati di esempio e ripartire da zero?')) demoOff(); };
document.getElementById('btnTour2').onclick=()=>startTour(1);

const STEPS=[
 {view:'cruscotto',sel:'.params',title:'I due numeri che guidano tutto',text:'Data del verbale di consegna e canone annuo netto. Dalla data si calcolano le scadenze una tantum (3 mesi per sistema informativo, app e TQRIF, 2 mesi per l\'ecosportello, 180 giorni per il centro servizi); dal canone la soglia del 10% oltre la quale si può risolvere il contratto.'},
 {view:'cruscotto',sel:'.cards',title:'Il cruscotto in trenta secondi',text:'Quanti obblighi risultano conformi, non conformi, parziali o mai verificati all\'ultima verifica registrata, e quante scadenze sono state superate senza che nessuno abbia controllato. È la vista pensata per Sindaco e consiglieri.'},
 {view:'cruscotto',sel:'#areeChart',title:'Dove si concentra il lavoro',text:'Ogni barra è un\'area del contratto. Cliccando una barra si apre il registro filtrato su quell\'area.'},
 {view:'registro',sel:'#q',title:'Cercare un dubbio',text:'Si scrive con parole semplici: "festivi", "cestini", "numero verde", "15 giorni", "P05". La ricerca guarda obbligo, evidenza, fonte e note. I filtri restringono per area, tipo ed esito.'},
 {view:'registro',sel:'#detail',title:'Verificare e documentare',text:'Selezionata una riga, il pannello mostra come si verifica, la penale collegata e la fonte (che apre il PDF alla pagina, se i documenti sono nella cartella docs). Qui si registra la verifica con data, esito e nota: è la traccia che ANAC chiede di poter esibire.',pre:()=>{selId='RAC-03';filtro={q:'',area:'',tipo:'',stato:''};}},
 {view:'timeline',sel:'#tl',title:'L\'anno contrattuale',text:'Un rigo per area: pallini blu per le scadenze, rossi se superate senza verifica, verdi/arancio/rossi per le verifiche registrate. Le zone vuote sono i periodi senza controlli. Cliccando un pallino si apre l\'obbligo.'},
 {view:'contestazioni',sel:'#fc',title:'Contestare con i termini giusti',text:'Da una verifica "non conforme" si apre la contestazione: il portale la numera, calcola il termine per le controdeduzioni (5 giorni) e quello per la decisione del RUP, raddoppia in caso di recidiva e somma le penali applicate nell\'anno contro la soglia del 10%.'},
 {view:'contestazioni',sel:'#btnExport',title:'Salvare e condividere',text:'Lo stato resta nel browser di chi lavora. Per passarlo a Simona o all\'ufficio, "Salva stato" produce un file JSON da conservare nella cartella condivisa; "Carica stato" lo riapre su un altro computer. Questa guida si può rivedere dalla sezione Documenti.'},
];
let tourStep=-1, tourEls=null;
function tourClose(){ if(tourEls){ tourEls.forEach(e=>e.remove()); tourEls=null; } tourStep=-1; try{localStorage.setItem(TOUR_KEY,'1');}catch(e){} }
function tourWelcome(){
  tourClose();
  const back=document.createElement('div'); back.className='tour-spot'; back.style.cssText='top:50%;left:50%;width:0;height:0';
  const box=document.createElement('div'); box.className='tour-box center';
  box.innerHTML=`<h4>Benvenuto nel portale di controllo del contratto</h4><p>Serve a verificare, obbligo per obbligo, se Diodoro Ecologia sta facendo quello che il contratto prevede, e a documentarlo. Per la prima volta puoi provarlo con dati inventati, oppure partire dal registro vuoto.</p>
  <div class="choice"><button class="btn primary" id="tDemo">Prova con dati di esempio<small>Data di avvio, canone, alcune verifiche e due contestazioni fittizie, tutte marcate ESEMPIO. Si cancellano con un pulsante.</small></button><button class="btn" id="tEmpty">Parti da zero con la guida<small>Registro completo, nessuna verifica registrata.</small></button><button class="btn" id="tSkip">Salta la guida<small>Puoi rivederla in "Documenti e istruzioni".</small></button></div>`;
  document.body.append(back,box); tourEls=[back,box];
  box.querySelector('#tDemo').onclick=()=>{ state=demoState(); persist(); initParams(); render(); startTour(0); };
  box.querySelector('#tEmpty').onclick=()=>startTour(0);
  box.querySelector('#tSkip').onclick=tourClose;
}
function startTour(i){ tourClose(); tourStep=i; showStep(); }
function showStep(){
  if(tourEls){ tourEls.forEach(e=>e.remove()); tourEls=null; }
  const st=STEPS[tourStep]; if(!st){ tourClose(); return; }
  if(st.pre) st.pre(); if(view!==st.view){ view=st.view; render(); } else if(st.pre) render();
  const target=document.querySelector(st.sel); if(target) target.scrollIntoView({block:'center',behavior:'instant'});
  const r=target? target.getBoundingClientRect() : {top:innerHeight/2,left:innerWidth/2,width:0,height:0,bottom:innerHeight/2,right:innerWidth/2};
  const spot=document.createElement('div'); spot.className='tour-spot'; spot.style.cssText=`top:${r.top-6}px;left:${r.left-6}px;width:${r.width+12}px;height:${r.height+12}px`;
  const box=document.createElement('div'); box.className='tour-box';
  box.innerHTML=`<h4>${st.title}</h4><p>${st.text}</p><div class="actions"><span class="steps">${tourStep+1} di ${STEPS.length}</span>${tourStep>0?'<button class="btn" id="tPrev">Indietro</button>':''}<button class="btn" id="tEnd">Chiudi</button><button class="btn primary" id="tNext">${tourStep<STEPS.length-1?'Avanti':'Fine'}</button></div>`;
  document.body.append(spot,box); tourEls=[spot,box];
  const bw=box.offsetWidth, bh=box.offsetHeight; let top=r.bottom+14, left=Math.min(Math.max(12,r.left),innerWidth-bw-12);
  if(top+bh>innerHeight-12) top=Math.max(12,r.top-bh-14); if(r.height>innerHeight*0.6) top=Math.max(12,innerHeight-bh-24);
  box.style.top=top+'px'; box.style.left=left+'px';
  box.querySelector('#tNext').onclick=()=>{ tourStep++; showStep(); };
  box.querySelector('#tEnd').onclick=tourClose;
  const p=box.querySelector('#tPrev'); if(p) p.onclick=()=>{ tourStep--; showStep(); };
  document.onkeydown=e=>{ if(e.key==='Escape') tourClose(); };
}
const _render=render; render=function(){ _render(); updateBanner(); const b=document.getElementById('btnTourDocs'); if(b) b.onclick=()=>tourWelcome(); };
render();
let firstRun=true; try{ firstRun=!localStorage.getItem(TOUR_KEY) && !Object.keys(state.verifiche).length && !state.avvio; }catch(e){}
if(firstRun) setTimeout(tourWelcome,300);
</script>
